name: Research verification

# Research artifacts are checked deliberately, not as a product-release gate.
# Run the structural lane alone for a quick registry check, or enable the full
# pinned-reference suite when actively working on research results.

on:
  workflow_dispatch:
    inputs:
      full:
        description: Build reference runtimes and run capture-dependent checks
        required: false
        type: boolean
        default: false

concurrency:
  group: evidence-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  evidence-venv-free:
    name: evidence.venv-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
        with:
          save-cache: "false"
      - name: Materialize pinned DSPy 3.2.1 source (git only, no venv)
        run: |
          git init -q tmp/dspy-3.2.1
          git -C tmp/dspy-3.2.1 remote add origin https://github.com/stanfordnlp/dspy.git
          git -C tmp/dspy-3.2.1 fetch -q --depth 1 origin 29448ae12756abdd14bd8796c819247ebb83673c
          git -C tmp/dspy-3.2.1 checkout -q FETCH_HEAD
      - name: Run venv-free evidence rows
        env:
          EVIDENCE_INFRASTRUCTURE: "1"
        run: |
          mix test \
            test/ensemble_differential_test.exs \
            test/mmgrpo_differential_test.exs \
            test/reproduction_registry_test.exs \
            test/evidence_provenance_test.exs

  evidence-full:
    name: evidence.full-capture
    if: inputs.full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
        with:
          save-cache: "false"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            scripts/setup_dspy_parity_env.sh
            scripts/setup_dspy_current_target.sh
            scripts/setup_reference_test_env.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3
      - name: Check out the pinned DSPy 3.2.1 source tree
        run: |
          git clone --filter=blob:none https://github.com/stanfordnlp/dspy.git tmp/dspy-3.2.1
          git -C tmp/dspy-3.2.1 checkout --detach 29448ae12756abdd14bd8796c819247ebb83673c
      - name: Build pinned DSPy reference environments
        run: |
          PYTHON=python3.12 scripts/setup_dspy_parity_env.sh
          PYTHON=python3.12 scripts/setup_dspy_current_target.sh
          PYTHON=python3.12 scripts/setup_reference_test_env.sh
      - name: Run the full evidence-infrastructure suite
        env:
          EVIDENCE_INFRASTRUCTURE: "1"
          DSPY_CAPTURE: "1"
        run: mix test --only evidence_infrastructure
