name: Evidence

# CI coverage for the evidence-infrastructure suite (tag :evidence_infrastructure),
# which had NO lane before this workflow — two defects (a fixture-authority reader
# and a stale admitted-artifact source binding) were only caught by running it by
# hand. The suite splits along one axis: some tests are pure structural /
# differential validators that read only committed benchmarks/evidence files, while
# most shell out to the pinned DSPy 3.2.1 parity venv + source tree under tmp/
# (tag :requires_dspy_capture). We run BOTH halves on the schedule they can each
# be green on:
#
#   * evidence-venv-free (every PR): EVIDENCE_INFRASTRUCTURE=1 WITHOUT DSPY_CAPTURE,
#     over the files whose capture-only rows are tagged :requires_dspy_capture, so
#     the venv-free rows run and the capture rows are excluded. Fast, no Python.
#
#   * evidence-full (weekly + manual): builds the pinned DSPy environments and runs
#     the whole suite with DSPY_CAPTURE=1. This is the complete lane; because it is
#     a scheduled/dispatch job and not a PR gate, a red run is a loud signal (e.g.
#     an admitted artifact whose source binding drifted from committed source),
#     which is exactly what this lane exists to surface.
#
# NB on tag mechanics: `mix test --only evidence_infrastructure --exclude
# requires_dspy_capture` does NOT work — an `--only`/`--include` tag
# unconditionally overrides `--exclude`, so capture rows would still run. The split
# is driven by ENV GATING in test/test_helper.exs (EVIDENCE_INFRASTRUCTURE and
# DSPY_CAPTURE each remove a tag from the default exclude list) plus explicit file
# arguments, never by `--only`.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC. The full capture lane is expensive (Python + DSPy build),
    # so it runs weekly rather than per-PR.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: evidence-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Per-PR: venv-free structural/differential evidence rows only. Runs on every PR
  # and push. No Python, no full git history — the rows here read committed
  # benchmarks/evidence files and exercise pure helpers (credential scrubbing,
  # fixture matching). Grow the file list as more files' capture-only rows get the
  # :requires_dspy_capture tag.
  evidence-venv-free:
    name: evidence.venv-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/elixir-setup
        with:
          save-cache: "false"
      - name: Run venv-free evidence rows
        env:
          EVIDENCE_INFRASTRUCTURE: "1"
          # DSPY_CAPTURE deliberately unset: :requires_dspy_capture rows stay
          # excluded so this job never touches the pinned DSPy environment.
        run: |
          mix test \
            test/ensemble_differential_test.exs \
            test/mmgrpo_differential_test.exs

  # Weekly / manual: the complete evidence suite against the pinned DSPy 3.2.1
  # parity environment. This is the only lane that builds the reference runtimes,
  # so it also carries the source-binding validators that need full git history.
  evidence-full:
    name: evidence.full-capture
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the source-binding validators resolve ancestor commit
          # SHAs (git show <artifact-sha>:<path>) and fail on a shallow checkout.
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
        with:
          save-cache: "false"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            scripts/setup_dspy_parity_env.sh
            scripts/setup_dspy_current_target.sh
            scripts/setup_reference_test_env.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3
      - name: Check out the pinned DSPy 3.2.1 source tree
        run: |
          git clone --filter=blob:none https://github.com/stanfordnlp/dspy.git tmp/dspy-3.2.1
          git -C tmp/dspy-3.2.1 checkout --detach 29448ae12756abdd14bd8796c819247ebb83673c
      - name: Build pinned DSPy reference environments
        run: |
          PYTHON=python3.12 scripts/setup_dspy_parity_env.sh
          PYTHON=python3.12 scripts/setup_dspy_current_target.sh
          scripts/setup_reference_test_env.sh
      - name: Run the full evidence-infrastructure suite
        env:
          EVIDENCE_INFRASTRUCTURE: "1"
          DSPY_CAPTURE: "1"
        # --only evidence_infrastructure scopes the run to the evidence suite (the
        # other gates already cover the regular suite). Both tags are un-excluded
        # by the env vars above, and --only force-includes every evidence row
        # (venv-free and :requires_dspy_capture alike).
        run: mix test --only evidence_infrastructure
