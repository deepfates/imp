name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            scripts/setup_dspy_parity_env.sh
            scripts/setup_reference_test_env.sh
      - run: mix local.hex --force
      - run: mix deps.get
      - name: Install pinned reference runtimes
        run: PYTHON=python3.12 scripts/setup_reference_test_env.sh
      - run: mix production.check
      - run: mix integration.check
      - run: mix protocol.check
      - run: mix package.check
      - run: mix livebook.check
      - run: mix quality.check
