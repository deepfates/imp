name: CI

on:
  push:
    branches: [main]
  pull_request:

# dorny/paths-filter diffs the PR via the GitHub API, which needs
# pull-requests:read; the repo's default GITHUB_TOKEN is restricted, so grant
# the read scopes explicitly (without this, `classify changes` fails with
# "Resource not accessible by integration" and every dependent job skips).
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

# Tiered, path-filtered CI. The old design ran the full monolith
# (Python/Deno install + package clean-room + 10-iteration failure campaign
# + livebook execution + docs) on EVERY push, including one-line doc typos —
# which is what exhausted the Actions budget. This version:
#
#   * `changes` classifies the diff (code vs docs/livebooks/evidence-only).
#   * `fast` (format + compile + deterministic unit suite, no Python/Deno)
#     runs on every PR and is the quick merge signal (~2-3 min). It is the
#     ONLY job that runs the unit suite: the heavy lane used to re-run the
#     same 110s suite inside production.check, which doubled the tax for
#     zero extra coverage (dee-9k5m).
#   * The heavy lane is three parallel jobs, each gated on code changes
#     (together they are `mix heavy.check` + `mix parity.check`; the old
#     single `production.check` job ran them serially on one runner):
#       - `campaign` (failure campaign + prompt-template parity vs the
#         pinned DSPy 3.2.1 venv; the only job needing Python/Deno)
#       - `package` (hex build + offline clean-room)
#       - `docs` (mix docs render + livebook validation; shared with the
#         docs-only path below)
#   * `integration`/`protocol`/`quality` run only when code changed.
#   * `docs` (mix docs + livebook.check) runs when docs/livebooks changed
#     OR when code changed (code can break doc rendering and livebooks).
#
# Every job that a given change does not need reports as skipped-success, so
# branch protection stays satisfiable without running the whole matrix on a
# README edit.

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'lib/**'
              - 'test/**'
              - 'scripts/**'
              - 'benchmarks/**'
              - 'priv/**'
              - 'examples/**'
              - 'mix.exs'
              - 'mix.lock'
              - '.github/**'
            docs:
              - 'docs/**'
              - 'livebooks/**'
              - 'README.md'
              - 'CHANGELOG.md'
              - 'RELEASE_NOTES.md'

  fast:
    name: fast.check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
      # Quick merge signal: no Python, no Deno, no package build, no campaign.
      # `mix fast.check` = format --check-formatted + compile --warnings-as-errors
      # + the deterministic unit suite (same exclusions as production.check's
      # test step, minus failure_campaign/package/livebooks/docs).
      #
      - run: mix fast.check

  campaign:
    name: campaign.check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            scripts/setup_dspy_parity_env.sh
            scripts/setup_dspy_current_target.sh
            scripts/setup_reference_test_env.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3
      # Cache the built reference runtimes themselves (dee-9k5m): the parity
      # venv alone cost ~53s of pip install per run to gate a 7s check. Keyed
      # on the exact bytes of the three setup scripts (which pin every
      # version), the RLM lockfile they install from, and the Python line.
      # Deliberately NO restore-keys: exact match or cold. A prefix fallback
      # is how the ~/.hex cache got poisoned four times (see
      # .github/actions/elixir-setup/action.yml) — a partial ancestor cache
      # must never seed a new key. This job is also the only writer of this
      # key. On a miss the setup scripts below rebuild everything from
      # scratch, loudly; on a hit they still run and re-validate the pinned
      # versions (each script self-checks and fails hard on a bad env), so a
      # stale or broken cache fails the job instead of skipping the gate. The
      # pip wheel cache above stays as the fallback for cold rebuilds.
      - name: Cache pinned reference runtimes (exact-key only)
        uses: actions/cache@v4
        with:
          path: |
            tmp/dspy-parity-venv
            tmp/dspy-current-venv
            tmp/dspy-current-target
            tmp/gepa-artifact
          key: refenv-v1-${{ runner.os }}-py3.12-${{ hashFiles('scripts/setup_dspy_parity_env.sh', 'scripts/setup_dspy_current_target.sh', 'scripts/setup_reference_test_env.sh', 'benchmarks/requirements-dspy-rlm.lock') }}
      - name: Install pinned reference runtimes
        run: |
          PYTHON=python3.12 scripts/setup_dspy_parity_env.sh
          PYTHON=python3.12 scripts/setup_dspy_current_target.sh
          PYTHON=python3.12 scripts/setup_reference_test_env.sh
      # campaign.check = failure campaign + prompt-template byte-parity to
      # DSPy 3.2.1 (dee-3e4v). The golden-trace test is
      # :evidence_infrastructure (excluded from the default suite) and
      # previously ran only on the weekly evidence-full lane; gating it on
      # every code PR via the dspy-parity venv above means a fidelity
      # regression fails the build the same day it lands, not the next
      # Monday.
      - run: mix campaign.check

  package:
    name: package.check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Single writer of the mix deps/_build/~/.hex cache: this is the job
      # with the offline ~/.hex requirement (the clean-room runs
      # HEX_OFFLINE=1 deps.get), so it alone saves — see the cache-poisoning
      # history in the action file.
      - uses: ./.github/actions/elixir-setup
        with:
          save-cache: "true"
      # Hex build + package contract test + offline clean-room (consumer and
      # deployment VMs against the built package).
      - run: mix package.check

  integration:
    name: integration.check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
      - run: mix integration.check

  protocol:
    name: protocol.check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
      - run: mix protocol.check

  quality:
    name: quality.check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
      - run: mix quality.check

  dialyzer:
    name: dialyzer.check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
        id: setup
      # PLT cache: exact key on OTP + Elixir + mix.lock, WITH a restore-keys
      # prefix fallback. That fallback is safe HERE and only here, unlike the
      # ~/.hex cache (see the poisoning history in
      # .github/actions/elixir-setup/action.yml): a PLT is not trusted as-is.
      # `mix dialyzer` re-checks the restored PLT against the current deps
      # every run and adds/rebuilds whatever is missing or stale, so a
      # partial ancestor PLT only saves build time — it cannot silently
      # define the result. The updated PLT is then saved under the new exact
      # key. This job is the only writer of this cache.
      - name: Cache dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: plt-v1-${{ runner.os }}-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-v1-${{ runner.os }}-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-
      # Fails on any warning not pinned in .dialyzer_ignore.exs (one reason
      # per entry there) and on stale ignore entries (list_unused_filters).
      - run: mix dialyzer.check

  differential:
    name: differential.check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The :dspy_parity suite validates Imp against real pinned DSPy 3.2.1:
      # a venv with the pinned release plus the pinned source checkout under
      # tmp/. Children also spawn via zsh (provenance-pinned command shape)
      # and run `mix run` in the dev env.
      - run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - run: scripts/setup_dspy_parity_env.sh
      - run: scripts/setup_dspy_stable_source.sh
      # Pinned GEPA v0.1.4 source (same shape as the maintainer checkout:
      # blob-filtered but FULL history - the version bridge inspects older
      # tags like v0.1.1, so no --depth 1).
      - run: git clone --filter=blob:none https://github.com/gepa-ai/gepa.git tmp/gepa-v0.1.4 && git -C tmp/gepa-v0.1.4 checkout --detach v0.1.4
      # Corrected GEPA comparator artifact checkout (hover/papillon pilots).
      # Its self-test imports gepa_artifact from the checkout root; the
      # maintainer environment had that on the ambient path, runners don't.
      - run: PYTHONPATH="$PWD/tmp/gepa-artifact" scripts/setup_corrected_gepa_comparator.sh tmp/gepa-artifact
      # Source-exact IFBench scorer venv (docs/internal/BENCHMARK_TRUTH.md).
      - run: |
          python3 -m venv tmp/ifbench-parity-venv
          tmp/ifbench-parity-venv/bin/python -m pip install -q -r benchmarks/requirements-ifbench-parity.txt
          tmp/ifbench-parity-venv/bin/python -m nltk.downloader -d tmp/ifbench-parity-venv/nltk_data stopwords averaged_perceptron_tagger_eng punkt_tab
      - run: MIX_ENV=dev mix deps.compile && MIX_ENV=dev mix compile
      # Deployment-example tests spawn children inside examples/deployment,
      # which is its own Mix project; build it fully so child runs don't
      # spend their test timeout compiling.
      - run: cd examples/deployment && IMP_PATH=../.. mix deps.get && IMP_PATH=../.. mix deps.compile && IMP_PATH=../.. mix compile
      # Known-red residue at introduction (tracked on imp-sqkr): the sealed
      # v1 contract detects mix.lock drift after the bandit CVE bump, and the
      # MuSiQue receipts read a machine-local /tmp data dir. This job makes
      # that visible on every run rather than hiding it in the fast lane.
      - run: mix differential.check

  docs:
    name: docs.check
    runs-on: ubuntu-latest
    needs: changes
    # Runs for docs/livebook changes (the docs-only path) AND for code
    # changes: this is the third slice of the old production.check monolith
    # (code edits can break doc rendering and livebook validation).
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
      # Render docs + validate livebooks, without the package build /
      # campaign / Python differentials.
      - run: mix docs.check
