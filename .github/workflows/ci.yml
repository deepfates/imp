name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/setup_dspy_parity_env.sh"
      - run: mix local.hex --force
      - run: mix deps.get
      - name: Install pinned DSPy reference runtime
        run: PYTHON=python3.12 scripts/setup_dspy_parity_env.sh
      - name: Check out pinned GEPA artifact reference
        run: |
          git clone https://github.com/gepa-ai/gepa-artifact.git tmp/gepa-artifact
          git -C tmp/gepa-artifact checkout cbefbc1aa0f43dd39874ec4bf42211365dbda42e
      - run: mix production.check
      - run: mix integration.check
      - run: mix protocol.check
      - run: mix package.check
      - run: mix livebook.check
      - run: mix quality.check
