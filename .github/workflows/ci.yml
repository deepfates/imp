name: CI

on:
  push:
    branches: [main]
  pull_request:

# dorny/paths-filter diffs the PR via the GitHub API, which needs
# pull-requests:read; the repo's default GITHUB_TOKEN is restricted, so grant
# the read scopes explicitly (without this, `classify changes` fails with
# "Resource not accessible by integration" and every dependent job skips).
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

# `check` is the ordinary merge signal. Package, protocol, integration,
# documentation, static analysis, and the pinned upstream differential stay
# separate because they exercise genuinely different environments. Research
# campaigns and evidence receipts are not release gates.

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'lib/**'
              - 'test/**'
              - 'scripts/**'
              - 'benchmarks/**'
              - 'priv/**'
              - 'examples/**'
              - 'mix.exs'
              - 'mix.lock'
              - '.github/**'
            docs:
              - 'docs/**'
              - 'livebooks/**'
              - 'README.md'
              - 'CHANGELOG.md'
              - 'RELEASE_NOTES.md'

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
      - run: mix check

  # `check` above restores the deps/_build cache when mix.lock matches, so on
  # a cache hit it never proves that a cold checkout can fetch and build. This
  # job does what a stranger does: clone, deps.get, mix check. No cache, no
  # Hex warm step, nothing carried over from another run. Full history because
  # `git clone` has it and some default tests read it.
  stranger:
    name: stranger.check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - run: mix local.hex --force
      - run: mix deps.get
      - run: mix check

  package:
    name: package.check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Single writer of the mix deps/_build/~/.hex cache: this is the job
      # with the offline ~/.hex requirement (the clean-room runs
      # HEX_OFFLINE=1 deps.get), so it alone saves — see the cache-poisoning
      # history in the action file.
      - uses: ./.github/actions/elixir-setup
        with:
          save-cache: "true"
      # Hex build + package contract test + offline clean-room (consumer and
      # deployment VMs against the built package).
      - run: mix package.check

  integration:
    name: integration.check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
      - run: mix integration.check

  protocol:
    name: protocol.check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
      - run: mix protocol.check

  quality:
    name: quality.check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
      - run: mix quality.check

  dialyzer:
    name: dialyzer.check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
        id: setup
      # PLT cache: exact key on OTP + Elixir + mix.lock, WITH a restore-keys
      # prefix fallback. That fallback is safe HERE and only here, unlike the
      # ~/.hex cache (see the poisoning history in
      # .github/actions/elixir-setup/action.yml): a PLT is not trusted as-is.
      # `mix dialyzer` re-checks the restored PLT against the current deps
      # every run and adds/rebuilds whatever is missing or stale, so a
      # partial ancestor PLT only saves build time — it cannot silently
      # define the result. The updated PLT is then saved under the new exact
      # key. This job is the only writer of this cache.
      - name: Cache dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: plt-v1-${{ runner.os }}-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-v1-${{ runner.os }}-otp${{ steps.setup.outputs.otp-version }}-elixir${{ steps.setup.outputs.elixir-version }}-
      # Fails on any warning not pinned in .dialyzer_ignore.exs (one reason
      # per entry there) and on stale ignore entries (list_unused_filters).
      - run: mix dialyzer.check

  differential:
    name: differential.check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The :dspy_parity suite validates Imp against real pinned DSPy 3.2.1:
      # a venv with the pinned release plus the pinned source checkout under
      # tmp/. Children also spawn via zsh (provenance-pinned command shape)
      # and run `mix run` in the dev env.
      - run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - run: scripts/setup_dspy_parity_env.sh
      - run: scripts/setup_dspy_stable_source.sh
      # Pinned GEPA v0.1.4 source (same shape as the maintainer checkout:
      # blob-filtered but FULL history - the version bridge inspects older
      # tags like v0.1.1, so no --depth 1).
      - run: git clone --filter=blob:none https://github.com/gepa-ai/gepa.git tmp/gepa-v0.1.4 && git -C tmp/gepa-v0.1.4 checkout --detach v0.1.4
      # Corrected GEPA comparator artifact checkout (hover/papillon pilots).
      # Its self-test imports gepa_artifact from the checkout root; the
      # maintainer environment had that on the ambient path, runners don't.
      - run: PYTHONPATH="$PWD/tmp/gepa-artifact" scripts/setup_corrected_gepa_comparator.sh tmp/gepa-artifact
      # Source-exact IFBench scorer venv (docs/BENCHMARKS.md).
      - run: |
          python3 -m venv tmp/ifbench-parity-venv
          tmp/ifbench-parity-venv/bin/python -m pip install -q -r benchmarks/requirements-ifbench-parity.txt
          tmp/ifbench-parity-venv/bin/python -m nltk.downloader -d tmp/ifbench-parity-venv/nltk_data stopwords averaged_perceptron_tagger_eng punkt_tab
      - run: MIX_ENV=dev mix deps.compile && MIX_ENV=dev mix compile
      # Deployment-example tests spawn children inside examples/deployment,
      # which is its own Mix project; build it fully so child runs don't
      # spend their test timeout compiling.
      # Children run in both dev (banking77) and test (hotpotqa) envs.
      - run: cd examples/deployment && IMP_PATH=../.. mix deps.get && IMP_PATH=../.. mix deps.compile && IMP_PATH=../.. mix compile && IMP_PATH=../.. MIX_ENV=test mix deps.compile && IMP_PATH=../.. MIX_ENV=test mix compile
      # Re-measured 2026-09-17 on a clean tracked tree: neither residue this
      # comment used to describe is still red. The mix.lock drift is gone and
      # the MuSiQue receipts are excluded by their own tag. The only remaining
      # failures came from Imp.UpstreamFidelityTest, which is removed with the
      # rest of the conformance-ledger machinery.
      - run: mix differential.check

  docs:
    name: docs.check
    runs-on: ubuntu-latest
    needs: changes
    # Runs for docs/livebook changes (the docs-only path) AND for code
    # Code edits can break doc rendering and livebook validation too.
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/elixir-setup
      # Render docs + validate livebooks, without the package build /
      # campaign / Python differentials.
      - run: mix docs.check
