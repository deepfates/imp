name: Elixir setup
description: >
  Shared BEAM/Elixir setup for all CI gates: toolchain, deps/_build cache
  keyed on mix.lock, hex, and dependency fetch. Keeping this in one place
  means the cache key cannot drift between the parallel gate jobs.

runs:
  using: composite
  steps:
    - uses: erlef/setup-beam@v1
      id: beam
      with:
        otp-version: "28"
        elixir-version: "1.19"
    - name: Cache Elixir deps and build
      uses: actions/cache@v4
      with:
        path: |
          deps
          _build
        key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
        restore-keys: |
          mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-
    - run: mix local.hex --force
      shell: bash
    - run: mix deps.get
      shell: bash
